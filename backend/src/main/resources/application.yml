server:
  port: 8081

spring:
  config:
    import: optional:file:./.env[.properties]
  config:
    import: optional:file:./.env[.properties]
  application:
    name: benhvien-backend
  datasource:
    url: jdbc:h2:file:./data/benhvien;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    org.hibernate.SQL: warn

# ===== Đăng nhập (JWT) & Google =====
app:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-flash-latest}
  jwt:
    # Đổi bằng biến môi trường JWT_SECRET khi triển khai thật (tối thiểu 32 ký tự)
    secret: ${JWT_SECRET:benhvien-secret-key-can-doi-truoc-khi-trien-khai-he-thong}
    expire-hours: 24
  google:
    # Client ID OAuth 2.0 (giống NEXT_PUBLIC_GOOGLE_CLIENT_ID của frontend)
    # để dùng tính năng "Đăng nhập bằng Google" — để trống thì tắt tính năng này
    client-id: ${GOOGLE_CLIENT_ID:}
