# Chạy với MySQL (tùy chọn, cho triển khai thật):
#   mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# Có thể ghi đè bằng biến môi trường: DB_URL, DB_USERNAME, DB_PASSWORD
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/benhvien?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false
